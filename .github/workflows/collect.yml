name: 毎晩のデータ収集

on:
  schedule:
    # 毎日 23:40（日本時間）= 14:40 UTC。昨日・一昨日の確定データを取り直す
    - cron: "40 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 準備
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          pip install -r pipeline/requirements.txt

      - name: 収集
        run: python pipeline/collect.py

      - name: 保存
        run: |
          bash pipeline/save.sh "data: $(TZ=Asia/Tokyo date +%Y-%m-%d) 収集" data/
